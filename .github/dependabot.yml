# Weekly update PRs, one per ecosystem, so CI checks each bump before it is merged.
# AndroidX AARs can raise minCompileSdk: if a bump fails on that, raise compileSdk (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

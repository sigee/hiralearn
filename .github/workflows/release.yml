# Builds the signed Play bundle for a version tag (v0.1.0) and publishes it as a GitHub Release.
# Upload the .aab to Play Console by hand. One-time setup (secrets, environment, tag rules) is in README → Releasing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Signed bundle and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The signing secrets live in this environment, which only v* tags may use.
    environment: release
    env:
      TAG: ${{ github.ref_name }}
      # Play needs a new, higher versionCode for every upload. The run number only grows (a re-run keeps it). If this
      # workflow is ever deleted and recreated, the count restarts at 1: set the repository variable
      # VERSION_CODE_OFFSET to the last code Play has so new codes continue above it.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_CODE_OFFSET: ${{ vars.VERSION_CODE_OFFSET || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to check the tag is on master and for generated release notes

      - name: Check the tag
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG is not on master. Tag a commit that was merged to master."; exit 1
          fi
          name=$(grep -Po 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName \"$name\" in app/build.gradle.kts."; exit 1
          fi
          code=$((VERSION_CODE + VERSION_CODE_OFFSET))
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "FINAL_CODE=$code" >> "$GITHUB_ENV"
          echo "Releasing $name with versionCode $code"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true # don't let a release write caches

      - name: Install Android platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.HIRALEARN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret HIRALEARN_KEYSTORE_BASE64 is not set."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Test and build the signed bundle
        env:
          HIRALEARN_STORE_FILE: ${{ runner.temp }}/upload.jks
          HIRALEARN_STORE_PASSWORD: ${{ secrets.HIRALEARN_STORE_PASSWORD }}
          HIRALEARN_KEY_ALIAS: ${{ secrets.HIRALEARN_KEY_ALIAS }}
          HIRALEARN_KEY_PASSWORD: ${{ secrets.HIRALEARN_KEY_PASSWORD }}
        run: ./gradlew :core:test :app:bundleRelease -Phiralearn.versionCode="$FINAL_CODE"

      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Without signing secrets the build succeeds but leaves the bundle unsigned, which Play rejects.
      - name: Check the signature
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if ! jarsigner -verify "$aab" | grep -q "jar verified"; then
            echo "::error::The bundle is not signed. Check the signing secrets."; exit 1
          fi
          echo "Upload certificate (compare with Play Console → App integrity):"
          keytool -printcert -jarfile "$aab" | grep -E "Owner|SHA1|SHA256"
          mkdir dist
          cp "$aab" "dist/hiralearn-$VERSION_NAME-$FINAL_CODE.aab"
          # Play reads the R8 mapping from inside the bundle; this copy is for decoding stack traces yourself.
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$VERSION_NAME-$FINAL_CODE.txt"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "HiraLearn $VERSION_NAME" \
            --generate-notes \
            --notes "versionCode $FINAL_CODE"
